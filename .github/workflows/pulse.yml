name: Play Store pulse

# Every Monday 09:00 IST, and on demand from the Actions tab.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Fetch, analyse, rebuild the page and the digest
        run: python -m pulse run --post
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}   # optional: posts the digest to a channel
      - name: Publish
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add docs data/snapshots.csv RECOMMENDATION.md
          git diff --cached --quiet || git commit -m "Pulse $(date -u +%F)"
          git push
